[package]
name = "stardew-sync-core"
version = "0.1.0"
edition = "2021"
authors = ["bazq"]

[lib]
name = "stardew_sync_core"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
xmltree = "0.11"
walkdir = "2.5"
sysinfo = "0.33"
tempfile = "3.17"

[[bin]]
name = "dry_run"
path = "src/bin/dry_run.rs"
